for cookie consent
cookie_consent:
  privacy_policy_link_text: *privacy_policy_title
  side_nav_setting_button_tooltip: &cookie_settings Настройки cookies
  panel_bar:
    msg: >
      Этот сайт использует файлы cookie для оптимизации работы.
      Они будут активированы с вашего согласия.
    privacy_msg: Ознакомьтесь с $privacy_link.
    buttons:
      accept: &accept_button Разрешить все
      settings: Настроить
      deny: &deny_button Отклонить
      close: Закрыть
  panel_settings:
    title: *cookie_settings
    msg: >
      Этот сайт использует файлы cookie для оптимизации работы.
      Они будут активированы с вашего согласия. Нажмите на элементы ниже для ознакомления с политикой использования cookies.
    privacy_msg: Ознакомьтесь с $privacy_link.
    buttons:
      accept: *accept_button
      save: Сохранить выбор
      deny: *deny_button
      always_active: Всегда активны
    consent_types:
      necessary:
        title: Строго необходимые cookies
        info: >
          Эти файлы cookie необходимы для работы сайта и не могут быть отключены.
          Они обычно устанавливаются при изменении настроек сайта, например, цветовой схемы.
          Эти файлы не хранят персональные данные.
          $gtag_info
      analytics:
        title: Cookies производительности
        info: $gtag_info
      preferences:
        title: Cookies функциональности
        info: $gtag_info
      advertising:
        title: Cookies таргетинга и рекламы
        info: $gtag_info
    gtag_info:
      # from https://support.google.com/tagmanager/answer/10718549#consent-types
      ad_storage: >
        Включает хранение (например, cookies), связанное с рекламой.
      analytics_storage: >
        Включает хранение (например, cookies), связанное с аналитикой, например, временем посещения.
      functionality_storage: >
        Включает хранение, поддерживающее функциональность сайта или приложения, например, настройки языка.
      personalization_storage: >
        Включает хранение, связанное с персонализацией, например, рекомендациями видео.
      security_storage: >
        Включает хранение, связанное с безопасностью, например, функциями аутентификации,
        предотвращением мошенничества и другой защитой пользователей.