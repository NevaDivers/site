###########################################################
# Личная информация владельца
###########################################################
# Название вашего бренда
brand: "Neva Divers"
# Текст под названием бренда
brand_sub_text: "$site_sample"
# Используется для SEO meta автора поста (если не указано в самом посте)
name: "ND team"
# Тексты заголовка главной страницы
home:
  # Вы также можете использовать $site_brand, $site_greetings, $site_welcome в line1 и line2 для замены текста.
  top_header_line1: "$site_welcome"
  # Если закомментировано, верхний заголовок будет в одну строку
  top_header_line2: "$site_brand"

# Подзаголовок страницы "О нас"
about:
  sub_title: "$site_sample"

# Если не хотите добавлять год копирайта, закомментируйте или оставьте пустым.
# Год, в котором впервые было заявлено об авторских правах на произведение.
copyright_start_year: "2026"

# Убедитесь, что creative_commons.enable установлено в true в файле _data/conf/main.yml
creative_commons:
  # Выберите лицензию на https://creativecommons.org/choose/?lang=en
  # Затем проверьте адрес ссылки под выбранной лицензией и убедитесь, что она совпадает со списком ниже
  # Выберите один из вариантов ниже:
  # 1. by        Attribution 4.0 International
  # 2. by-nd     Attribution-NoDerivatives 4.0 International
  # 3. by-sa     Attribution-ShareAlike 4.0 International
  # 4. by-nc     Attribution-NonCommercial 4.0 International
  # 5. by-nc-nd  Attribution-NonCommercial-NoDerivatives 4.0 International
  # 6. by-nc-sa  Attribution-NonCommercial-ShareAlike 4.0 International
  license_type: "by-sa"

# SEO meta: обязательно для каждого языка
# Если meta_description не указан в front matter, он формируется из контента поста/страницы.
# Если контент отсутствует, используется это значение. Также применяется в manifest.json
meta_common_description: "Мы с удовольствием приглашаем всех желающих, с опытом и «с нуля», заглянуть в этот завораживающий и непростой мир, представление о котором сконцентрировано в известном всей планете слове дайвинг."

# Параметры контактов (низ боковой панели и страница "О нас")
# Порядок элементов будет отображаться как здесь.
# Закомментируйте, чтобы удалить любой элемент контакта
contacts:
#- github:  " "
#- email:  " "
#- linkedin:  " "
#- twitter:  " "
#- mastodon:  " "
#- instagram:  " "
#- youtube:  " "
#- facebook:  " "
# Чтобы добавить другие, проверьте файл _data/const/contact.yml
- your_new_contact: ""

# Убедитесь, что один из движков комментариев включен в файле _data/conf/posts.yml
comments:
  # Создайте аккаунт Disqus и заполните поля ниже.
  disqus:
    shortname: ""
  # Для использования Giscus перейдите на https://giscus.app и найдите раздел "Configuration".
  # - Введите имя вашего репозитория, и система создаст настройки ниже в разделе "Enable giscus".
  # - Скопируйте соответствующие значения и вставьте их в поля ниже.
  # Для других настроек проверьте файл _data/conf/posts.yml.
  giscus:
    repo: ""
    repo-id: ""
    category: ""
    category-id: ""
    # Если ID не указан, эта функция будет отключена.
    
# Убедитесь, что ваше окружение не совпадает с google.analytics.ignore в _data/conf/main.yml
google_analytics_id: ""

# Существуют разные способы верификации веб-страницы. Один из них - добавление этого значения в meta html.
# Убедитесь, что вы установили meta.google_site_verify: true в _data/conf/main.yml
# Убедитесь, что ваше окружение не совпадает с google.site_verification.ignore в _data/conf/main.yml
google_site_verification: ""

# Убедитесь, что вы установили contact_form.enable: true в _data/conf/main.yml
# - Создайте форму в Google Forms. Можно использовать шаблон "Contact Information".
# - Настройте цвета формы и валидацию ответов под ваши нужды.
# - Чтобы отключить принудительный вход через Google, перейдите в "Настройки > Ответы" и выключите "Ограничить до 1 ответа".
# - Нажмите кнопку "Отправить" в правом верхнем углу.
# - Нажмите на значок ссылки в списке "Отправить через" и скопируйте ссылку.
# - Вставьте ссылку между двойными кавычками ниже.
google_forms_contact_form_url: ""

###########################################################
# Данные страницы проектов
# Вы можете переместить этот контент в front matter файла [language]/tabs/projects.md
###########################################################
page_data:
  main:
    header: "Проекты"
    info: "Описание страницы ваших проектов."
    text_color: "white"
    # Если не хотите использовать фоновое изображение, закомментируйте строку. Будет активирован back_color.
    img: ":projects-heading.jpg"
    back_color: "lightblue"
    category:
    - title: "Пример"
      type: id_example
      color: "gray"
    - title: "Изображение"
      type: id_picture
      color: "#62b462"
    - title: "Цитата"
      type: id_quote
      color: "#2FD0ED"
    list:
